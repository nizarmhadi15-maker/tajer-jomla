<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

<title>تاجر جملة</title>

<style>
:root{--p:#0f766e;--p2:#14b8a6;--bg:#f1f5f4;--card:#fff;--tx:#1f2937;--mu:#6b7280;--bd:#e5e7eb;--dan:#dc2626}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:Tahoma,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--tx);font-size:16px}
#topbar{position:sticky;top:0;z-index:5;background:var(--p);color:#fff;padding:14px 16px;font-size:19px;font-weight:bold;display:flex;align-items:center;gap:8px}
#topbar.hidden{display:none}
#app{padding:12px 12px 90px;max-width:760px;margin:auto}
#tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--bd);display:flex;z-index:6}
#tabs.hidden{display:none}
#tabs button{flex:1;background:none;border:0;padding:8px 2px 10px;font:inherit;font-size:13px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
#tabs button span{font-size:21px}
#tabs button.on{color:var(--p);font-weight:bold}
.bdg{position:absolute;top:4px;right:calc(50% - 22px);background:var(--dan);color:#fff;border-radius:10px;font-size:11px;padding:1px 6px;font-weight:bold}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
label{display:block;font-size:14px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;font:inherit;background:#fff;color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--p2);border-color:transparent}
.btn{border:0;border-radius:10px;padding:11px 14px;font:inherit;font-weight:bold;background:#e6f4f2;color:var(--p);cursor:pointer}
.btn.primary{background:var(--p);color:#fff}
.btn.danger{background:#fee2e2;color:var(--dan);width:100%;margin-top:8px}
.btn.big{width:100%;padding:14px;font-size:17px;margin-top:16px}
.btn.small{padding:7px 10px;font-size:14px}
.btn:disabled{opacity:.6}
.muted{color:var(--mu)}.small{font-size:13px}
.auth{max-width:420px;margin:auto;padding-top:20px;text-align:center}
.auth .logo{font-size:56px}.auth h1{margin:4px 0;color:var(--p)}
.auth form{text-align:right;margin-top:12px}
.seg{display:flex;background:#e2e8f0;border-radius:12px;padding:4px;margin-top:16px}
.seg button{flex:1;border:0;background:none;padding:10px;border-radius:9px;font:inherit;font-weight:bold;color:var(--mu)}
.seg button.on{background:#fff;color:var(--p);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.roles{display:flex;gap:8px}
.role{flex:1;margin:0}.role input{display:none}
.role span{display:block;padding:12px 6px;border:2px solid var(--bd);border-radius:10px;text-align:center;color:var(--tx);font-weight:bold}
.role input:checked+span{border-color:var(--p);background:#e6f4f2;color:var(--p)}
.toolbar{display:flex;gap:8px;margin-bottom:8px}
.search{margin-bottom:8px}
.plist{display:flex;flex-direction:column;gap:8px}
.pitem{background:#fff;border-radius:12px;padding:10px;display:flex;gap:10px;align-items:center;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.pitem.off{opacity:.55}
.pimg{width:62px;height:62px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#f3f4f6}
.pimg.ph{display:flex;align-items:center;justify-content:center;font-size:28px}
.pinfo{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.pinfo b{overflow:hidden;text-overflow:ellipsis}
.price{color:var(--p);font-weight:bold}
.pact{display:flex;align-items:center;gap:6px}
.icon{border:0;background:#f3f4f6;border-radius:8px;padding:8px;font-size:16px}
.switch{position:relative;width:46px;height:26px;margin:0;flex-shrink:0}.switch input{display:none}
.switch i{position:absolute;inset:0;background:#d1d5db;border-radius:20px;transition:.2s}
.switch i:after{content:"";position:absolute;width:20px;height:20px;top:3px;right:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+i{background:var(--p2)}.switch input:checked+i:after{right:23px}
.step{display:flex;align-items:center;gap:4px}
.step button{width:36px;height:36px;border-radius:10px;border:0;background:#e6f4f2;color:var(--p);font-size:20px;font-weight:bold}
.step input{width:50px;text-align:center;padding:7px 2px}
.tag{background:#fee2e2;color:var(--dan);border-radius:8px;padding:4px 8px;font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}
.chip{border:1px solid var(--bd);background:#fff;border-radius:20px;padding:6px 12px;white-space:nowrap;font:inherit;font-size:14px}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.tcard{display:flex;gap:12px;align-items:center;cursor:pointer}
.tcard .av{width:50px;height:50px;border-radius:50%;background:#e6f4f2;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0}
.back{border:0;background:none;color:var(--p);font:inherit;font-weight:bold;padding:4px 0 10px}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.cartbar{position:fixed;bottom:66px;left:12px;right:12px;background:var(--p);color:#fff;border-radius:14px;padding:13px 16px;display:flex;justify-content:space-between;font-weight:bold;z-index:4;box-shadow:0 4px 12px rgba(0,0,0,.2);max-width:736px;margin:auto}
.hidden{display:none!important}
.cline{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.cline .nm{flex:1;min-width:0}
.total{display:flex;justify-content:space-between;font-size:18px;font-weight:bold;padding:12px 0}
.ocard{cursor:pointer}
.ohead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.st{border-radius:8px;padding:3px 9px;font-size:13px;font-weight:bold;color:#fff;white-space:nowrap}
.empty{text-align:center;color:var(--mu);padding:40px 20px}
.empty div{font-size:46px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
#modal.hidden{display:none}
.sheet{background:#fff;width:100%;max-width:760px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px 28px;position:relative}
.sheet h2{margin:0 0 8px;font-size:20px}
.xbtn{position:absolute;left:12px;top:12px;border:0;background:#f3f4f6;border-radius:50%;width:34px;height:34px;font-size:18px}
.row2{display:flex;gap:8px}.row2>div{flex:1}
.imgpick{border:2px dashed var(--bd);border-radius:12px;height:130px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:30px;color:var(--mu);overflow:hidden;cursor:pointer}
.imgpick img{width:100%;height:100%;object-fit:contain}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.kv div{background:#f8fafc;border-radius:10px;padding:8px}.kv span{display:block;font-size:12px;color:var(--mu)}
.otable{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
.otable th,.otable td{border-bottom:1px solid var(--bd);padding:7px 4px;text-align:right}
.otable th{background:#f8fafc;color:var(--mu);font-weight:normal}
.otable tfoot td{font-weight:bold;font-size:16px;border:0}
.statusbtns{display:flex;flex-wrap:wrap;gap:6px}
.sbtn{border:2px solid var(--c);color:var(--c);background:#fff;border-radius:10px;padding:8px 10px;font:inherit;font-size:14px;font-weight:bold}
.sbtn.on{background:var(--c);color:#fff}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:11px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:50;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.loading{text-align:center;padding:30px;color:var(--mu)}
.splash{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;min-height:70vh;color:var(--p);font-size:22px}
.slogo{font-size:64px;animation:pop 1s ease-in-out infinite alternate}
@keyframes pop{from{transform:scale(.92)}to{transform:scale(1.06)}}
.spin{width:30px;height:30px;border:3px solid #cce7e3;border-top-color:var(--p);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#printArea{display:none}
#printArea.show{display:block;position:fixed;inset:0;background:#fff;z-index:40;overflow:auto;padding:12px}
.pbar{display:flex;gap:8px;justify-content:space-between;margin-bottom:12px}
.invoice{max-width:760px;margin:auto;color:#111}
.ihead{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--p);padding-bottom:10px}
.ihead h1{margin:0;font-size:22px}.ibrand{color:var(--p);font-weight:bold;font-size:18px}
.iparties{display:flex;gap:10px;margin:14px 0}
.iparties div{flex:1;border:1px solid #ddd;border-radius:8px;padding:8px;display:flex;flex-direction:column;gap:2px}
.iparties small{color:#666}
.itable{width:100%;border-collapse:collapse;font-size:14px}
.itable th,.itable td{border:1px solid #ccc;padding:7px;text-align:right}
.itable th{background:#e6f4f2}
.itable tfoot td{font-weight:bold;font-size:16px;background:#f8fafc}
.inote{border:1px solid #ddd;border-radius:8px;padding:8px}.ifoot{color:#666;font-size:13px}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea,#printArea.show{display:block!important;position:static;padding:0;overflow:visible}
  .noprint{display:none!important}
}
</style>
</head>
<body>
<header id="topbar" class="hidden"><span id="ttl">تاجر جملة</span></header>
<main id="app"><div class="splash"><div class="slogo">🛒</div><b>تاجر جملة</b><div class="spin"></div></div></main>
<nav id="tabs" class="hidden"></nav>
<div id="modal" class="hidden"></div>
<div id="toast"></div>
<div id="printArea"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, deleteUser, EmailAuthProvider, reauthenticateWithCredential } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initializeFirestore, getFirestore, persistentLocalCache, doc, getDoc, setDoc, updateDoc, deleteDoc, addDoc, collection, query, where, getDocs, onSnapshot, serverTimestamp, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCTayav6FAQ5LnaFLnOqFkFLXuLBJ5YidA",
  authDomain: "tajer-jomla.firebaseapp.com",
  projectId: "tajer-jomla",
  storageBucket: "tajer-jomla.firebasestorage.app",
  messagingSenderId: "520128581274",
  appId: "1:520128581274:web:9c119b07859b4505661923"
};
const SITE_URL = "https://nizarmhadi15-maker.github.io/tajer-jomla/";

const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
let db;
try { db = initializeFirestore(fb, { localCache: persistentLocalCache() }); } catch (e) { db = getFirestore(fb); }

// ---------- helpers ----------
const S = { me:null, tab:null, products:[], orders:[], traders:null, viewTrader:null, viewProducts:[], unsubs:[], registering:false, ofilter:'all', firstOrders:true };
const STATUS = { new:['جديدة','#2563eb'], preparing:['قيد التجهيز','#d97706'], ready:['جاهزة للاستلام','#059669'], done:['تم التسليم','#6b7280'], cancelled:['ملغاة','#dc2626'] };
const DAY = 86400000;
const DEFAULT_CFG = { traderPrice:50, grocerPrice:20, trialDays:14, payInfo:'' };
S.cfg = { ...DEFAULT_CFG };
try { const c0 = JSON.parse(localStorage.getItem('tj_cfg') || 'null'); if(c0) S.cfg = { ...S.cfg, ...c0 }; } catch(e){}
S.atab = 'pays';
const monthsDays = m => m === 12 ? 365 : m * 30;
const isActive = () => !!S.me && (S.me.admin === true || (S.me.subUntil || 0) > Date.now());
const daysLeft = () => Math.max(0, Math.ceil(((S.me?.subUntil || 0) - Date.now()) / DAY));
const userActive = u => u.admin === true || (!u.frozen && !u.deleted && (u.subUntil || 0) > Date.now());
const fmtDay = ms => new Date(ms).toLocaleDateString('ar-u-nu-latn', { year:'numeric', month:'short', day:'numeric' });
const priceFor = role => role === 'trader' ? S.cfg.traderPrice : S.cfg.grocerPrice;
async function loadCfg(){ try { const c = await getDoc(doc(db,'config','app')); if(c.exists()) S.cfg = { ...DEFAULT_CFG, ...c.data() }; } catch(e){} }
const UNITS = ['كرتونة','حبة','قطعة','كيس','شوال','ربطة','كيلو','علبة','درزن','باكيت','جالون'];
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const digits = s => String(s ?? '').replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
const normPhone = s => digits(s).replace(/\D/g, '');
const phoneEmail = p => normPhone(p) + '@tajer-jomla.app';
const num = v => { const n = parseFloat(digits(v).replace('٫','.').replace(',','.')); return isNaN(n) ? 0 : n; };
const money = n => (Math.round((n||0)*100)/100).toLocaleString('en-US',{maximumFractionDigits:2}) + ' ₪';
const tsMs = ts => ts?.toMillis ? ts.toMillis() : Date.now();
const fmtDate = ts => new Date(tsMs(ts)).toLocaleString('ar-u-nu-latn', { dateStyle:'short', timeStyle:'short' });
const emptyBox = (icon, msg) => `<div class="empty"><div>${icon}</div>${msg}</div>`;
const setTitle = t => $('#ttl').textContent = t;

function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }
function intlPhone(p){ p=normPhone(p); if(p.startsWith('00')) return p.slice(2); if(p.startsWith('0')) return '970'+p.slice(1); return p; }
function openExternal(url){ if(window.Android && Android.openUrl) Android.openUrl(url); else window.open(url,'_blank'); }
function whatsapp(phone, text){ openExternal(`https://wa.me/${intlPhone(phone)}?text=${encodeURIComponent(text)}`); }
function openModal(html){ const m=$('#modal'); m.innerHTML=`<div class="sheet"><button class="xbtn" id="xbtn">✕</button>${html}</div>`; m.classList.remove('hidden'); $('#xbtn').onclick=closeModal; m.onclick=e=>{ if(e.target===m) closeModal(); }; }
function closeModal(){ const m=$('#modal'); m.classList.add('hidden'); m.innerHTML=''; }
function twoTap(btn, label, fn){ btn.onclick=()=>{ if(btn.dataset.sure){ fn(); } else { btn.dataset.sure=1; btn.textContent=label; setTimeout(()=>{ delete btn.dataset.sure; },4000); } }; }

window.appBack = () => {
  if(!$('#modal').classList.contains('hidden')){ closeModal(); return true; }
  if($('#printArea').classList.contains('show')){ $('#printArea').classList.remove('show'); return true; }
  if(S.viewTrader && S.tab==='traders'){ S.viewTrader=null; render(); return true; }
  return false;
};

function compress(file, max=480, q=0.6){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => { const im = new Image(); im.onload = () => {
      let w=im.width, h=im.height; const s=Math.min(1, max/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s);
      const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,w,h); x.drawImage(im,0,0,w,h);
      res(c.toDataURL('image/jpeg', q)); }; im.onerror=rej; im.src=r.result; };
    r.onerror=rej; r.readAsDataURL(file);
  });
}
const pimg = p => p.image ? `<img class="pimg" src="${p.image}" loading="lazy">` : `<div class="pimg ph">📦</div>`;

function authErr(e){
  const c = e?.code || '';
  if(/invalid-credential|wrong-password|user-not-found|invalid-email/.test(c)) return 'رقم الجوال أو كلمة المرور غير صحيحة';
  if(c.includes('email-already-in-use')) return 'هذا الرقم مسجل من قبل، سجّل دخول';
  if(c.includes('weak-password')) return 'كلمة المرور لازم تكون 6 أحرف على الأقل';
  if(c.includes('network')) return 'لا يوجد اتصال بالإنترنت';
  if(c.includes('operation-not-allowed')) return 'تسجيل الدخول غير مفعّل في Firebase';
  if(c.includes('too-many-requests')) return 'محاولات كثيرة، انتظر قليلاً';
  return 'صار خطأ: ' + c;
}

function showDeletedNotice(){
  const sp = S.cfg.supportPhone;
  setTimeout(() => {
    openModal(`<div style="text-align:center"><div style="font-size:54px">⛔</div><h2>هذا الحساب محذوف</h2>
      <p class="muted">تم حذف هذا الحساب من إدارة التطبيق، فما بتقدر تدخل عليه أو تسجّل بنفس الرقم.<br>إذا بدك ترجعه تواصل مع الإدارة.</p>
      ${sp ? '<button class="btn primary big" id="supWa">💬 تواصل مع الإدارة</button>' : ''}</div>`);
    if(sp) $('#supWa').onclick = () => whatsapp(sp, 'مرحبا، حسابي في تطبيق تاجر جملة انحذف وبدي أرجعه.');
  }, 300);
}

// ---------- opening hours ----------
const DAYS = ['الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
function fmtTime(t){ if(!t) return ''; let [H, M] = t.split(':').map(Number); const ap = H < 12 ? 'ص' : 'م'; H = H % 12 || 12; return `${H}:${String(M).padStart(2,'0')} ${ap}`; }
function openNow(t){
  if(!t.openTime || !t.closeTime) return null;
  const now = new Date(), day = now.getDay(), mins = now.getHours()*60 + now.getMinutes();
  const toM = s => { const [a,b] = s.split(':').map(Number); return a*60 + b; };
  const o = toM(t.openTime), c = toM(t.closeTime);
  const off = Number(t.offDay ?? -1);
  if(o === c) return day !== off;
  if(o < c) return day !== off && mins >= o && mins < c;
  if(mins >= o) return day !== off;
  return (day + 6) % 7 !== off && mins < c;
}
function hoursLine(t, big){
  const st = openNow(t); if(st === null) return '';
  const off = Number(t.offDay ?? -1);
  return `<div class="small" style="margin-top:${big?8:4}px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">
    <span class="st" style="background:${st?'#059669':'#6b7280'}">${st ? '🟢 مفتوح الآن' : '🔴 مغلق الآن'}</span>
    <span class="muted">🕗 ${fmtTime(t.openTime)} - ${fmtTime(t.closeTime)}${off >= 0 ? ' · عطلة ' + DAYS[off] : ''}</span></div>`;
}

// ---------- uniqueness helpers ----------
function fixPhone(s){ let p = normPhone(s); if(p.startsWith('00')) p = p.slice(2); if(/^97[02]/.test(p)) p = '0' + p.slice(3); if(/^5\d{8}$/.test(p)) p = '0' + p; return p; }
const cleanName = s => String(s || '').trim().replace(/\s+/g, ' ');
const nameKey = s => cleanName(s).replace(/[أإآٱ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/[ًٌٍَُِّْـ]/g,'').replace(/\s+/g,'').toLowerCase();
async function shopTaken(shop, exceptId){
  const [a, b] = await Promise.all([
    getDocs(query(collection(db,'users'), where('shopKey','==',nameKey(shop)))),
    getDocs(query(collection(db,'users'), where('shop','==',cleanName(shop))))
  ]);
  return [...a.docs, ...b.docs].some(d => d.id !== exceptId);
}

// ---------- auth ----------
function renderAuth(mode='login'){
  $('#topbar').classList.add('hidden'); $('#tabs').classList.add('hidden');
  const reg = mode === 'reg';
  app.innerHTML = `<div class="auth">
    <div class="logo">🛒</div><h1>تاجر جملة</h1>
    <p class="muted">اطلب بضاعتك من تجار الجملة وأنت في محلك</p>
    <div class="seg"><button class="${!reg?'on':''}" data-m="login">تسجيل دخول</button><button class="${reg?'on':''}" data-m="reg">حساب جديد</button></div>
    <form id="af" class="card">
      ${reg ? `<label>نوع الحساب</label>

  const addSup = () => {

  };

  $('#af').onsubmit = async e => {

    const shop = reg ? cleanName(f.get('shop')) : '';
    if(reg && shop.length < 2) return toast('اكتب اسم المحل');
    btn.disabled = true;
    try {
      if(reg){
        S.registering = true;
        const cred = await createUserWithEmailAndPassword(auth, phoneEmail(phone), f.get('pass'));
        if(await shopTaken(shop)){
          try { await deleteUser(cred.user); } catch(e){ await signOut(auth); }
          S.registering = false; btn.disabled = false;
          return toast('❌ اسم المحل "' + shop + '" موجود من قبل، اختار اسم ثاني');
        }

        try { used = (await getDoc(tRef)).exists(); } catch(e){}
        const until = used ? Date.now() - 60000 : Date.now() + Math.min(30, S.cfg.trialDays) * DAY;
        const bt = writeBatch(db);
        bt.set(doc(db,'users',cred.user.uid), { role:f.get('role'), name:cleanName(f.get('name')), shop, shopKey:nameKey(shop), area:(f.get('area')||'').trim(), phone, subUntil:until, createdAt:serverTimestamp() });

        await bt.commit();
        S.registering = false;
        await enter(cred.user);
        if(used) openModal(`<div style="text-align:center"><div style="font-size:54px">ℹ️</div><h2>أهلاً فيك من جديد</h2>
          <p class="muted">هذا الرقم استخدم <b>التجربة المجانية</b> من قبل، فما في تجربة مجانية ثانية.<br>اشترك عشان تكمل استخدام التطبيق.</p>

      } else {
        await signInWithEmailAndPassword(auth, phoneEmail(phone), f.get('pass'));
      }
    } catch(err){
      S.registering = false; btn.disabled = false;
      if(reg && String(err.code).includes('email-already-in-use')){
        openModal(`<div style="text-align:center"><div style="font-size:54px">📱</div><h2>هذا الرقم مسجل من قبل</h2>
          <p class="muted">إذا هذا رقمك، سجّل دخول بكلمة المرور تبعتك.<br>وإذا كان حسابك انحذف من الإدارة، تواصل معنا لاسترجاعه.</p>
          <button class="btn primary big" id="goLogin">🔑 تسجيل دخول</button>
          ${S.cfg.supportPhone ? '<button class="btn big" id="supWa2">💬 تواصل مع الإدارة على واتساب</button>' : ''}</div>`);
        $('#goLogin').onclick = () => { closeModal(); renderAuth('login'); };
        if($('#supWa2')) $('#supWa2').onclick = () => whatsapp(S.cfg.supportPhone, 'مرحبا، بدي أسجّل في تطبيق تاجر جملة برقم ' + phone + ' بس بيقلي الرقم مسجل من قبل.');
      } else toast(authErr(err));
    }
  };
}

onAuthStateChanged(auth, async user => {
  S.unsubs.forEach(u => u()); S.unsubs = [];
  if(!user){ S.me=null; renderAuth(); return; }
  if(S.registering) return;
  await enter(user);
});

async function enter(user){
  const meKey = 'tj_me_' + user.uid;
  let cached = null;
  try { cached = JSON.parse(localStorage.getItem(meKey) || 'null'); } catch(e){}
  try { const c = JSON.parse(localStorage.getItem('tj_cfg') || 'null'); if(c) S.cfg = { ...DEFAULT_CFG, ...c }; } catch(e){}
  const cfgP = loadCfg().then(() => { try { localStorage.setItem('tj_cfg', JSON.stringify(S.cfg)); } catch(e){} });
  if(cached){
    if(cached.deleted){ try { localStorage.removeItem(meKey); } catch(e){} await cfgP; await signOut(auth); showDeletedNotice(); return; }
    S.me = { id:user.uid, ...cached };
  } else {
    app.innerHTML = '<div class="splash"><div class="slogo">🛒</div><b>تاجر جملة</b><div class="spin"></div></div>';
    let snap;
    try { snap = await getDoc(doc(db,'users',user.uid)); } catch(e){ app.innerHTML = emptyBox('📡','تعذّر الاتصال. تأكد من الإنترنت وأعد فتح التطبيق.'); return; }
    if(!snap.exists()){ toast('الحساب غير مكتمل، سجّل من جديد'); await signOut(auth); return; }
    if(snap.data().deleted){ await cfgP; await signOut(auth); showDeletedNotice(); return; }
    S.me = { id:user.uid, ...snap.data() };
    await cfgP;
  }
  if(!S.me.admin && S.me.subUntil == null){
    const until = Date.now() + Math.min(30, S.cfg.trialDays) * DAY;
    S.me.subUntil = until;
    updateDoc(doc(db,'users',user.uid), { subUntil:until }).catch(() => {});
  }
  S.unsubs.push(onSnapshot(doc(db,'users',user.uid), s => {
    if(!S.me || S.deleting) return;
    if(!s.exists()){ if(!s.metadata.fromCache){ try { localStorage.removeItem(meKey); } catch(e){} toast('الحساب غير موجود، سجّل من جديد'); signOut(auth); } return; }
    const was = isActive(), oldAdmin = !!S.me.admin, oldFrozen = !!S.me.frozen;
    const d = s.data();
    if(d.deleted){ try { localStorage.removeItem(meKey); } catch(e){} S.unsubs.forEach(u => u()); S.unsubs = []; signOut(auth); showDeletedNotice(); return; }
    S.me = { id:user.uid, ...d };
    try { localStorage.setItem(meKey, JSON.stringify({ ...d, createdAt:null })); } catch(e){}
    if(was !== isActive()){ toast(isActive() ? '✅ تم تفعيل اشتراكك' : '⛔ انتهى اشتراكك'); render(); }
    else if(oldAdmin !== !!S.me.admin || oldFrozen !== !!S.me.frozen) render();
  }));
  if(!S.me.admin && S.me.phone){
    const tRef = doc(db,'trials',S.me.phone);
    getDoc(tRef).then(t => { if(!t.exists()) setDoc(tRef, { phone:S.me.phone, at:serverTimestamp() }).catch(() => {}); }).catch(() => {});
  }
  S.tab = S.me.admin ? 'traders' : (S.me.role === 'trader' ? 'products' : 'traders');
  S.firstOrders = true; S.traders = null; S.viewTrader = null;
  $('#topbar').classList.remove('hidden'); $('#tabs').classList.remove('hidden');
  const field = S.me.role === 'trader' ? 'traderId' : 'grocerId';
  S.unsubs.push(onSnapshot(query(collection(db,'orders'), where(field,'==',S.me.id)), snap => {
    if(!S.firstOrders && S.me.role==='trader'){
      snap.docChanges().forEach(ch => { if(ch.type==='added'){ const o=ch.doc.data(); toast(`📥 طلبية جديدة من ${o.grocerShop}`); try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){} } });
    }
    S.firstOrders = false;
    S.orders = snap.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b) => tsMs(b.createdAt) - tsMs(a.createdAt));
    if(S.tab==='orders') render(); else renderTabs();
  }, e => toast('خطأ في تحميل الطلبيات: ' + e.code)));
  if(S.me.role === 'trader'){
    S.unsubs.push(onSnapshot(query(collection(db,'products'), where('traderId','==',S.me.id)), snap => {
      S.products = snap.docs.map(d => ({ id:d.id, ...d.data() })).sort((a,b) => (a.category||'').localeCompare(b.category||'','ar') || a.name.localeCompare(b.name,'ar'));
      if(S.tab==='products' && $('#modal').classList.contains('hidden')) render();
    }, e => toast('خطأ في تحميل البضاعة: ' + e.code)));
  }
  render();
}

// ---------- layout ----------
const TABS = {
  trader: [['products','📦','بضاعتي'],['orders','🧾','الطلبيات'],['account','👤','حسابي']],
  grocer: [['traders','🏭','التجار'],['cart','🛒','السلة'],['orders','🧾','طلبياتي'],['account','👤','حسابي']]
};
function badge(k){
  let n = 0;
  if(k==='orders' && S.me.role==='trader') n = S.orders.filter(o => o.status==='new').length;
  if(k==='cart') n = cartLines();
  return n ? `<i class="bdg">${n}</i>` : '';
}
function renderTabs(){
  const nav = $('#tabs');
  const tabs = S.me.admin ? [['traders','🏭','التجار'],['admin','⚙️','الإدارة'],['account','👤','حسابي']] : TABS[S.me.role];
  if(!tabs.some(t => t[0]===S.tab) && !['subscribe'].includes(S.tab)) S.tab = tabs[0][0];
  nav.innerHTML = tabs.map(([k,i,l]) => `<button class="${S.tab===k?'on':''}" data-tab="${k}"><span>${i}</span>${l}${badge(k)}</button>`).join('');
  $$('button', nav).forEach(b => b.onclick = () => { if(S.tab===b.dataset.tab && b.dataset.tab==='traders') S.viewTrader=null; S.tab=b.dataset.tab; render(); window.scrollTo(0,0); });
}
function render(){
  if(!S.me) return;
  if(S.me.frozen && !S.me.admin) return vFrozen();
  $('#tabs').classList.remove('hidden');
  renderTabs();
  const t = S.tab;
  if(!isActive() && ['products','traders','cart'].includes(t)) return vSubscribe();
  if(t==='products') vProducts();
  else if(t==='orders') vOrders();
  else if(t==='account') vAccount();
  else if(t==='cart') vCart();
  else if(t==='subscribe') vSubscribe();
  else if(t==='admin') vAdmin();
  else if(t==='traders') S.viewTrader ? vTraderPage() : vTraders();
  if(!S.me.admin && isActive() && daysLeft() <= 3 && ['products','traders','cart','orders'].includes(t)){
    app.insertAdjacentHTML('afterbegin', `<div class="card" id="subWarn" style="background:#fffbeb;cursor:pointer">⏳ اشتراكك بينتهي بعد <b>${daysLeft()}</b> يوم. اضغط هون للتجديد ‹</div>`);
    $('#subWarn').onclick = () => { S.tab='subscribe'; render(); };
  }
}

function vFrozen(){
  setTitle('تاجر جملة');
  $('#tabs').classList.add('hidden');
  app.innerHTML = `<div class="card" style="text-align:center;margin-top:30px"><div style="font-size:60px">🧊</div>
    <h2>حسابك مجمّد</h2><p class="muted">تم تجميد حسابك مؤقتاً من إدارة التطبيق.<br>للاستفسار تواصل مع الإدارة.</p>

          try { await updateDoc(doc(db,'users',u.id), { subUntil:until }); closeModal(); toast(msg); vAdmin(); }

        <div><label>اشتراك البقالة (₪/شهر)</label><input name="grocerPrice" inputmode="decimal" value="${S.cfg.grocerPrice}"></div></div>
        <label>أيام التجربة المجانية للحساب الجديد (أقصى شي 30)</label><input name="trialDays" inputmode="numeric" value="${S.cfg.trialDays}">
        <label>رقم واتساب الإدارة (للتواصل)</label><input name="supportPhone" inputmode="tel" value="${esc(S.cfg.supportPhone || '')}" placeholder="059xxxxxxx">
        <label>معلومات الدفع (بتظهر للمشتركين)</label>
        <textarea name="payInfo" rows="4" placeholder="مثلاً:&#10;جوال باي: 059xxxxxxx&#10;بال باي: 059xxxxxxx&#10;بنك فلسطين: رقم الحساب ... باسم ...">${esc(S.cfg.payInfo)}</textarea>
        <button class="btn primary big">حفظ الإعدادات</button></form>`;
      $('#cfgf').onsubmit = async e => {
        e.preventDefault();
        const f = new FormData(e.target);
        const c = { traderPrice:num(f.get('traderPrice')), grocerPrice:num(f.get('grocerPrice')), trialDays:Math.min(30, Math.max(0, Math.round(num(f.get('trialDays'))))), payInfo:f.get('payInfo').trim(), supportPhone:fixPhone(f.get('supportPhone')) };
        try { await setDoc(doc(db,'config','app'), c, { merge:true }); S.cfg = { ...S.cfg, ...c }; toast('تم حفظ الإعدادات ✅'); }
        catch(err){ toast('فشل الحفظ: ' + err.code); }
      };
    }
  } catch(e){ box.innerHTML = emptyBox('⚠️', 'تعذّر التحميل: ' + (e.code || e.message)); }
}
function bindSearch(inputSel, itemSel){
  const inp = $(inputSel); if(!inp) return;
  inp.oninput = () => { const q = inp.value.trim(); $$(itemSel).forEach(el => el.classList.toggle('hidden', !!q && !el.dataset.s.includes(q))); };
}

function productForm(p = {}){
  const cats = [...new Set(S.products.map(x => x.category).filter(Boolean))];
  openModal(`<h2>${p.id ? 'تعديل صنف' : 'صنف جديد'}</h2>
  <form id="pf">
    <div class="imgpick" id="imgPick">${p.image ? `<img src="${p.image}">` : '📷<small style="font-size:14px">صورة الصنف (اختياري)</small>'}</div>
    <input type="file" accept="image/*" id="imgFile" hidden>
    <label>اسم الصنف</label><input name="name" required value="${esc(p.name)}">
    <div class="row2"><div><label>السعر (₪)</label><input name="price" inputmode="decimal" required value="${p.price ?? ''}"></div>
    <div><label>الوحدة</label><select name="unit">${UNITS.map(u => `<option ${u===(p.unit||'كرتونة')?'selected':''}>${u}</option>`).join('')}</select></div></div>
    <label>التصنيف (اختياري)</label><input name="category" list="cats" value="${esc(p.category)}" placeholder="مثلاً: معلبات، منظفات، مشروبات">
    <datalist id="cats">${cats.map(c => `<option value="${esc(c)}">`).join('')}</datalist>
    <label>تفاصيل (اختياري)</label><input name="desc" value="${esc(p.desc)}" placeholder="مثلاً: الكرتونة 24 حبة">
    <button class="btn primary big" type="submit">حفظ</button>
    ${p.id ? '<button type="button" class="btn danger" id="delP">🗑️ حذف الصنف</button>' : ''}
  </form>`);
  let image = p.image || '';
  $('#imgPick').onclick = () => $('#imgFile').click();
  $('#imgFile').onchange = async e => {
    const f = e.target.files[0]; if(!f) return;
    try { image = await compress(f); $('#imgPick').innerHTML = `<img src="${image}">`; } catch(err){ toast('تعذّر قراءة الصورة'); }
  };
  $('#pf').onsubmit = e => {
    e.preventDefault();
    const f = new FormData(e.target);
    const data = { traderId:S.me.id, name:f.get('name').trim(), price:num(f.get('price')), unit:f.get('unit'), category:f.get('category').trim(), desc:f.get('desc').trim(), image, available:p.available!==false, updatedAt:serverTimestamp() };
    if(!data.name) return toast('اكتب اسم الصنف');
    if(data.price <= 0) return toast('اكتب السعر');
    const pr = p.id ? updateDoc(doc(db,'products',p.id), data) : addDoc(collection(db,'products'), { ...data, createdAt:serverTimestamp() });
    pr.catch(err => toast('فشل الحفظ: ' + err.code));
    closeModal(); toast('تم الحفظ ✅'); render();
  };
  if(p.id) twoTap($('#delP'), 'اضغط مرة ثانية للتأكيد', () => { deleteDoc(doc(db,'products',p.id)).catch(err => toast('فشل الحذف: '+err.code)); closeModal(); toast('تم الحذف'); });
}

      .sort((a,b) => (b.available!==false) - (a.available!==false) || (a.category||'').localeCompare(b.category||'','ar') || a.name.localeCompare(b.name,'ar'));

  }
}

const cartKey = () => 'tj_cart_' + S.me.id;
function getCart(){ try { return JSON.parse(localStorage.getItem(cartKey()) || '{}'); } catch(e){ return S._cart || {}; } }
function saveCart(c){ S._cart = c; try { localStorage.setItem(cartKey(), JSON.stringify(c)); } catch(e){} renderTabs(); updateCartBar(); }
function cartLines(){ const c = getCart(); return Object.values(c).reduce((n,t) => n + Object.keys(t.items).length, 0); }
function setQty(t, p, qty){
  const c = getCart();
  if(!c[t.id]) c[t.id] = { trader:{ id:t.id, shop:t.shop, name:t.name, phone:t.phone }, items:{} };
  if(qty > 0) c[t.id].items[p.id] = { name:p.name, unit:p.unit, price:p.price, qty };
  else delete c[t.id].items[p.id];
  if(!Object.keys(c[t.id].items).length) delete c[t.id];
  saveCart(c);
}
function updateCartBar(){
  const bar = $('#cartbar'); if(!bar || !S.viewTrader) return;
  const tc = getCart()[S.viewTrader.id];
  if(!tc){ bar.classList.add('hidden'); return; }
  const its = Object.values(tc.items), tot = its.reduce((s,i) => s + i.qty*i.price, 0);
  bar.innerHTML = `<span>🛒 ${its.length} صنف · ${money(tot)}</span><span>عرض السلة ‹</span>`;
  bar.classList.remove('hidden');
  bar.onclick = () => { S.tab = 'cart'; render(); window.scrollTo(0,0); };
}

function sendOrder(tid, note){
  const c = getCart(), tc = c[tid]; if(!tc) return;
  const items = Object.entries(tc.items).map(([pid,i]) => ({ pid, name:i.name, unit:i.unit, price:i.price, qty:i.qty }));
  const o = {
    no: String(Date.now()).slice(-6),
    traderId: tid, traderShop: tc.trader.shop, traderName: tc.trader.name, traderPhone: tc.trader.phone,
    grocerId: S.me.id, grocerShop: S.me.shop, grocerName: S.me.name, grocerPhone: S.me.phone, grocerArea: S.me.area || '',
    items, total: items.reduce((s,i) => s + i.qty*i.price, 0), note, status: 'new', createdAt: serverTimestamp()
  };
  const backup = tc;
  addDoc(collection(db,'orders'), o).catch(err => { const cc = getCart(); cc[tid] = backup; saveCart(cc); toast('❌ فشل إرسال الطلبية، رجعناها للسلة: ' + err.code); });
  delete c[tid]; saveCart(c);
  vCart();
  openModal(`<div style="text-align:center"><div style="font-size:56px">✅</div><h2>تم إرسال الطلبية #${o.no}</h2>
    <p class="muted">وصلت لـ ${esc(o.traderShop)} داخل التطبيق. تقدر كمان تبعتله نسخة على واتساب.</p>
    <button class="btn primary big" id="waSend">💬 إرسال نسخة على واتساب</button>
    <button class="btn big" id="goOrders">🧾 عرض طلبياتي</button></div>`);
  $('#waSend').onclick = () => whatsapp(o.traderPhone, orderText(o));
  $('#goOrders').onclick = () => { closeModal(); S.tab='orders'; render(); };
}

// ---- smart importer ----
const UNIT_WORDS = [['كرتونه','كرتونة'],['كرتون','كرتونة'],['كراتين','كرتونة'],['صندوق','كرتونة'],['ctn','كرتونة'],['carton','كرتونة'],['box','كرتونة'],
  ['قطعه','قطعة'],['حبه','حبة'],['حبات','حبة'],['pcs','حبة'],['piece','حبة'],['pc','حبة'],
  ['شوال','شوال'],['كيس','كيس'],['ربطه','ربطة'],['درزن','درزن'],['دزينه','درزن'],['باكيت','باكيت'],['باكو','باكيت'],['pack','باكيت'],['علبه','علبة'],['جالون','جالون'],['كيلو','كيلو'],['كغ','كيلو'],['kg','كيلو']];
function unitFrom(text, strict){
  const k = nameKey(text); if(!k) return '';
  for(const [w, u] of UNIT_WORDS){ if(strict ? k === w || k === 'ال'+w : k.includes(w)) return u; }
  return '';
}
function unitFromName(name){
  const k = nameKey(name);
  if(/(كرتون|كراتين|صندوق|ctn|carton)/.test(k)) return 'كرتونة';
  if(/\d+\s*[x×*]\s*\d+/i.test(name) || /[x×*]\s*\d+\s*$/i.test(name) || /\d+\s*(حبه|حبات|قطعه|علبه|pcs)/.test(k)) return 'كرتونة';
  if(/شوال/.test(k)) return 'شوال';
  if(/ربطه/.test(k)) return 'ربطة';
  if(/(درزن|دزينه)/.test(k)) return 'درزن';
  if(/(باكيت|باكو)/.test(k)) return 'باكيت';
  return '';
}
function parsePrice(v){
  if(typeof v === 'number') return v > 0 ? v : 0;
  const m = digits(String(v)).replace(/[,،](?=\d{3}\b)/g,'').replace('٫','.').match(/\d+(?:[.,]\d+)?/);
  return m ? parseFloat(m[0].replace(',','.')) : 0;
}
const isNumCell = v => typeof v === 'number' || /^\s*[₪$]?\s*[\d٠-٩]+([.,٫][\d٠-٩]+)?\s*(₪|شيكل|شيقل|nis|ils)?\s*$/i.test(String(v));
function findHeader(rows){
  for(let r = 0; r < Math.min(rows.length, 15); r++){
    const H = rows[r].map(x => nameKey(String(x ?? '')));
    const nameI = (() => { for(const k of ['اسم','بيان','منتج','صنف','الماده','name','product','item','description']){ const i = H.findIndex(x => x && x.includes(k) && !x.includes('تصنيف') && !x.includes('سعر')); if(i >= 0) return i; } return -1; })();
    const priceIs = H.map((x,i) => (x && /(سعر|ثمن|price|قيمه)/.test(x)) ? i : -1).filter(i => i >= 0);
    if(nameI >= 0 && priceIs.length){
      const f = keys => H.findIndex(x => x && keys.some(k => x.includes(k)));
      return { row:r, name:nameI, prices:priceIs.map(i => ({ i, unit:unitFrom(rows[r][i]) })), unit:f(['وحده','unit','عبوه']), category:f(['تصنيف','قسم','category','نوع']), desc:f(['تفاصيل','وصف','ملاحظ','note']), avail:f(['متوفر','available']) };
    }
  }
  return null;
}
function guessCols(rows){
  const n = Math.max(...rows.map(r => r.length));
  const st = [...Array(n)].map((_, c) => {
    const vals = rows.map(r => r[c]).filter(v => String(v ?? '').trim() !== '');
    const nums = vals.filter(isNumCell).map(parsePrice);
    const seq = nums.length > 3 && nums.every((x, i) => i === 0 || x === nums[i-1] + 1);
    const barcode = nums.length && nums.filter(x => x >= 100000).length > nums.length / 2;
    return { c, text: vals.filter(v => !isNumCell(v) && String(v).trim().length >= 2).length, nums: nums.length, bad: seq || barcode };
  });
  const name = [...st].sort((a,b) => b.text - a.text)[0];
  const prices = st.filter(s => s.c !== name.c && !s.bad && s.nums >= Math.max(2, rows.length * 0.4)).sort((a,b) => b.nums - a.nums);
  if(!name || !name.text || !prices.length) return null;
  return { row:-1, name:name.c, prices:[{ i:prices[0].c, unit:'' }], unit:-1, category:-1, desc:-1, avail:-1 };
}
function extractItems(wb){
  const out = [];
  for(const sn of wb.SheetNames){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header:1, defval:'', raw:true }).filter(r => r.some(x => String(x).trim() !== ''));
    if(!rows.length) continue;
    const cols = findHeader(rows) || guessCols(rows);
    if(!cols) continue;
    const main = cols.prices.find(p => p.unit === 'كرتونة') || cols.prices[0];
    const others = cols.prices.filter(p => p !== main);
    let cat = wb.SheetNames.length > 1 && !/^(sheet|ورقه)\s*\d*$/i.test(nameKey(sn)) ? sn : '';
    rows.slice(cols.row + 1).forEach(r => {
      const g = i => i >= 0 ? String(r[i] ?? '').trim() : '';
      const name = cleanName(g(cols.name));
      const price = parsePrice(r[main.i]);
      const filled = r.filter(x => String(x).trim() !== '').length;
      if(!price && filled <= 2){ const t = r.map(x => String(x ?? '').trim()).find(x => x && !isNumCell(x)); if(t && t.length < 40) cat = cleanName(t); return; }
      if(!name || isNumCell(name) || price <= 0) return;
      if(findHeader([r])) return;
      const unit = unitFrom(g(cols.unit), true) || unitFrom(g(cols.unit)) || main.unit || unitFromName(name);
      const extra = others.map(p => { const v = parsePrice(r[p.i]); return v > 0 ? `${p.unit || 'سعر ثاني'}: ${v} ₪` : ''; }).filter(Boolean).join(' · ');
      const av = nameKey(g(cols.avail));
      out.push({ name, price, unit, category: g(cols.category) || cat, desc: [g(cols.desc), extra].filter(Boolean).join(' · '), available: !['لا','no','0','false','غيرمتوفر'].includes(av) });
    });
  }
  const m = new Map(); out.forEach(i => m.set(nameKey(i.name), i));
  return [...m.values()].sort((a,b) => (a.category||'').localeCompare(b.category||'','ar') || a.name.localeCompare(b.name,'ar'));
}

  if(!await ensureXLSX()) return;
  let items;
  try { items = extractItems(XLSX.read(await file.arrayBuffer(), { type:'array' })); }
  catch(e){ return toast('تعذّر قراءة الملف، تأكد إنه ملف Excel'); }
  if(!items.length) return toast('ما لقيت أصناف بأسعار في الملف. لازم يكون فيه عمود أسماء وعمود أسعار');

    </tbody></table></div>
    <button class="btn primary big" id="impGo">✅ رفع ${items.length} صنف</button>`);
  if($('#defUnit')) $('#defUnit').onchange = e => $$('select[data-unknown]').forEach(s => s.value = e.target.value);
  $$('select[data-u]').forEach(s => s.onchange = () => s.removeAttribute('data-unknown'));

      const ops = [
        ...add.map(i => ({ ref: doc(collection(db,'products')), data:{ traderId:S.me.id, ...i, image:'', createdAt:serverTimestamp(), updatedAt:serverTimestamp() }, set:true })),
        ...upd.map(i => ({ ref: doc(db,'products', byKey.get(nameKey(i.name)).id), data:{ price:i.price, unit:i.unit, ...(i.category ? { category:i.category } : {}), ...(i.desc ? { desc:i.desc } : {}), available:i.available, updatedAt:serverTimestamp() } }))
      ];
      for(let k = 0; k < ops.length; k += 400){
        const bt = writeBatch(db);
        ops.slice(k, k + 400).forEach(o => o.set ? bt.set(o.ref, o.data) : bt.update(o.ref, o.data));
        await bt.commit();
        btn.textContent = `⏳ ${Math.min(k + 400, ops.length)} / ${ops.length}`;
      }
      closeModal(); toast(`✅ انضاف ${add.length} صنف جديد وتحدّث ${upd.length}`);
    } catch(e){ btn.disabled = false; btn.textContent = '✅ حاول مرة ثانية'; toast('فشل الرفع: ' + (e.code || e.message)); }
  };
}

async function exportExcel(o){
  if(!window.XLSX){
    toast('⏳ جاري تجهيز ملف Excel...');
    try { await loadXLSX(); } catch(e){ return toast('تعذّر تحميل مكتبة Excel، تأكد من الإنترنت'); }
  }
  const rows = [
    ['طلبية رقم', o.no], ['التاريخ', fmtDate(o.createdAt)],
    ['البقالة', o.grocerShop], ['صاحب البقالة', o.grocerName], ['جوال البقالة', o.grocerPhone], ['المنطقة', o.grocerArea || ''],
    ['التاجر', o.traderShop], [],
    ['#', 'الصنف', 'الوحدة', 'الكمية', 'السعر (₪)', 'المجموع (₪)'],
    ...o.items.map((i,n) => [n+1, i.name, i.unit, i.qty, i.price, Math.round(i.qty*i.price*100)/100]),
    [], ['', '', '', '', 'الإجمالي', Math.round(o.total*100)/100]
  ];
  if(o.note) rows.push([], ['ملاحظة', o.note]);
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{wch:14},{wch:30},{wch:10},{wch:8},{wch:12},{wch:14}];
  const wb = XLSX.utils.book_new(); wb.Workbook = { Views:[{ RTL:true }] };
  XLSX.utils.book_append_sheet(wb, ws, 'الطلبية');
  const name = `طلبية-${o.no}.xlsx`;
  if(window.Android && Android.saveFile){
    Android.saveFile(XLSX.write(wb, { bookType:'xlsx', type:'base64' }), name, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
  } else { XLSX.writeFile(wb, name); toast('تم تنزيل ملف Excel'); }
}

    <div class="iparties">
      <div><small>من البقالة</small><b>${esc(o.grocerShop)}</b><span>${esc(o.grocerName)} · ${esc(o.grocerPhone)}</span>${o.grocerArea ? `<span>📍 ${esc(o.grocerArea)}</span>` : ''}</div>
      <div><small>إلى التاجر</small><b>${esc(o.traderShop)}</b><span>${esc(o.traderName)} · ${esc(o.traderPhone)}</span></div></div>

      <tbody>${o.items.map((i,n) => `<tr><td>${n+1}</td><td>${esc(i.name)}</td><td>${esc(i.unit)}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${money(i.qty*i.price)}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td colspan="5">الإجمالي</td><td>${money(o.total)}</td></tr></tfoot></table>

// ---------- delete own account ----------
function deleteMyAccount(){
  const m = S.me, dl = isActive() ? daysLeft() : 0;
  openModal(`<div style="text-align:center"><div style="font-size:54px">⚠️</div><h2>حذف الحساب نهائياً</h2></div>
    <div class="card" style="background:#fef2f2;border:1px solid #fecaca;line-height:1.9">
      ${dl > 0 ? `<b>• باقي لك ${dl} يوم في اشتراكك، ولن يتم استرداد أي مبلغ عنها.</b><br>` : ''}
      • لو كان لك أيام متبقية من الاشتراك <b>لن يتم استرداد المال</b>.<br>
      • سيتم حذف حسابك <b>نهائياً</b> ولا يمكن استرجاعه.<br>
      ${m.role==='trader' ? '• ستنحذف كل بضاعتك وتختفي من قائمة التجار.<br>' : '• ستنحذف سلتك وبيانات حسابك.<br>'}
      • لو بدك ترجع تستخدم التطبيق لازم تعمل حساب جديد وتدفع اشتراك جديد.</div>
    <label class="role" style="display:flex;gap:8px;align-items:center;margin:12px 0;color:var(--tx)"><input type="checkbox" id="delOk" style="width:auto;display:inline"> قرأت وفهمت، وموافق على حذف حسابي نهائياً</label>
    <label>اكتب كلمة المرور للتأكيد</label><input type="password" id="delPass">
    <button class="btn danger big" id="delGo">🗑️ حذف حسابي نهائياً</button>
    <button class="btn big" id="delNo">تراجع</button>`);
  $('#delNo').onclick = closeModal;
  $('#delGo').onclick = async () => {
    if(!$('#delOk').checked) return toast('لازم توافق على الشروط أولاً');
    const pass = $('#delPass').value; if(!pass) return toast('اكتب كلمة المرور');
    const btn = $('#delGo'); btn.disabled = true; btn.textContent = '⏳ جاري الحذف...';
    const user = auth.currentUser;
    try {
      await reauthenticateWithCredential(user, EmailAuthProvider.credential(user.email, pass));
    } catch(e){ btn.disabled = false; btn.textContent = '🗑️ حذف حسابي نهائياً'; return toast(/wrong-password|invalid-credential/.test(e.code) ? 'كلمة المرور غلط' : authErr(e)); }
    try {
      S.deleting = true;
      S.unsubs.forEach(u => u()); S.unsubs = [];
      const refs = [];
      if(m.role === 'trader'){ const ps = await getDocs(query(collection(db,'products'), where('traderId','==',user.uid))); ps.docs.forEach(d => refs.push(d.ref)); }
      refs.push(doc(db,'users',user.uid));
      for(let i = 0; i < refs.length; i += 400){ const bt = writeBatch(db); refs.slice(i, i+400).forEach(r => bt.delete(r)); await bt.commit(); }
      try { localStorage.removeItem('tj_me_' + user.uid); localStorage.removeItem('tj_cart_' + user.uid); } catch(e){}
      await deleteUser(user);
      S.deleting = false; closeModal();
      toast('تم حذف حسابك نهائياً. مع السلامة 👋');
    } catch(e){ S.deleting = false; btn.disabled = false; btn.textContent = '🗑️ حذف حسابي نهائياً'; toast('فشل الحذف: ' + (e.code || e.message)); }
  };
}

// ---------- account ----------
function vAccount(){
  setTitle('حسابي');
  const m = S.me, isT = m.role === 'trader';
  app.innerHTML = `<div class="card" style="text-align:center"><div style="font-size:50px">${m.admin ? '👑' : isT ? '🏭' : '🏪'}</div>
      <b style="font-size:19px">${esc(m.shop)}</b><div class="muted">${m.admin ? 'مدير التطبيق' : isT ? 'تاجر جملة' : 'صاحب بقالة'} · ${esc(m.phone)}</div></div>
    ${m.admin ? '' : `<div class="card ohead" id="subCard" style="cursor:pointer">
      <div><b>💳 الاشتراك</b><div class="muted small">${isActive() ? `فعّال حتى ${fmtDay(m.subUntil)} · باقي ${daysLeft()} يوم` : 'منتهي'}</div></div>
      <span class="btn small ${isActive() ? '' : 'primary'}">${isActive() ? 'تجديد' : 'جدّد الآن'}</span></div>`}
    <form id="accf" class="card">
      <label>اسمك</label><input name="name" value="${esc(m.name)}" required>
      <label>اسم المحل / المخزن</label><input name="shop" value="${esc(m.shop)}" required>
      <label>المنطقة</label><input name="area" value="${esc(m.area)}">
      ${isT && !m.admin ? `<div class="card" style="background:#f0fdfa;margin:12px 0 0"><b>🕗 ساعات الدوام</b><div class="muted small">بتظهر للبقالات مع حالة "مفتوح الآن" أو "مغلق"</div>
        <div class="row2"><div><label>وقت الفتح</label><input type="time" name="openTime" value="${esc(m.openTime || '')}"></div>
        <div><label>وقت الإغلاق</label><input type="time" name="closeTime" value="${esc(m.closeTime || '')}"></div></div>
        <label>يوم العطلة</label><select name="offDay"><option value="-1">بدون عطلة</option>${DAYS.map((d,i) => `<option value="${i}" ${Number(m.offDay ?? -1)===i?'selected':''}>${d}</option>`).join('')}</select></div>` : ''}
      <button class="btn primary big">حفظ التعديلات</button></form>
    <div class="card"><button class="btn big" id="share" style="margin-top:0">📲 شارك التطبيق على واتساب</button>
      <button class="btn danger big" id="out">🚪 تسجيل خروج</button></div>
    ${m.admin ? '' : '<div style="text-align:center"><button class="btn small" id="delMe" style="background:none;color:var(--dan);text-decoration:underline">حذف حسابي نهائياً</button></div>'}
    <p class="muted small" style="text-align:center">تاجر جملة · نسخة 1.0</p>`;
  if($('#subCard')) $('#subCard').onclick = () => { S.tab = 'subscribe'; render(); };
  $('#accf').onsubmit = async e => {
    e.preventDefault();
    const f = new FormData(e.target), d = { name:cleanName(f.get('name')), shop:cleanName(f.get('shop')), area:f.get('area').trim() };
    if(f.has('openTime')){
      d.openTime = f.get('openTime') || ''; d.closeTime = f.get('closeTime') || ''; d.offDay = Number(f.get('offDay'));
      if(!!d.openTime !== !!d.closeTime) return toast('اكتب وقت الفتح ووقت الإغلاق الاثنين');
    }
    d.shopKey = nameKey(d.shop);
    if(d.shop.length < 2) return toast('اكتب اسم المحل');
    if(d.shopKey !== nameKey(m.shop || '')){
      try { if(await shopTaken(d.shop, m.id)) return toast('❌ اسم المحل "' + d.shop + '" موجود من قبل، اختار اسم ثاني'); }
      catch(err){ return toast('تعذّر التحقق من الاسم، تأكد من الإنترنت'); }
    }
    updateDoc(doc(db,'users',m.id), d).catch(err => toast('فشل الحفظ: ' + err.code));
    Object.assign(S.me, d); toast('تم الحفظ ✅'); vAccount();
  };
  $('#share').onclick = () => openExternal('https://wa.me/?text=' + encodeURIComponent(`🛒 تطبيق "تاجر جملة": اطلب بضاعة محلك من تجار الجملة وأنت مكانك، والتاجر يستلم الطلبية جاهزة.\n${SITE_URL}`));
  twoTap($('#out'), 'اضغط مرة ثانية لتسجيل الخروج', () => signOut(auth));
  if($('#delMe')) $('#delMe').onclick = deleteMyAccount;
}
</script>
